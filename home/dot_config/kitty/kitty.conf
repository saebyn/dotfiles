background_opacity	0.9
font_size		10.0
# Read the flag at startup/reload, rather than inheriting a possibly stale environment.
geninclude stream-font-size.sh
# One socket per Kitty process, accessible only within this user's runtime directory.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-stream-mode-{kitty_pid}
font_family		SauceCodePro Nerd Font Mono
bold_font		auto
italic_font		auto
bold_italic_font	auto
tab_bar_style		powerline
tab_powerline_style	slanted
tab_bar_edge		top
tab_bar_margin_height	0.0 0.0
map kitty_mod+enter 	new_window_with_cwd
map kitty_mod+n		new_os_window_with_cwd
map kitty_mod+t		new_tab_with_cwd

map ctrl+plus change_font_size all +1
map ctrl+minus change_font_size all -1
map ctrl+0 change_font_size all 0

# BEGIN_KITTY_THEME
# Solarized Dark Higher Contrast
include current-theme.conf
# END_KITTY_THEME
